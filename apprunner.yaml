version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - echo "Installing dependencies"
      - npm install
      - echo "Building application"
      - npm run build
run:
  runtime-version: 22.14.0
  command: npm start
  network:
    port: 8080
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: DB_HOST
      value: my-postgres-db.cny4we0u4x0v.ap-south-1.rds.amazonaws.com
    - name: DB_USER
      value: myuser
    - name: DB_PASSWORD
      value: MySecurePassword123!
    - name: DB_NAME
      value: postgres
    - name: DB_PORT
      value: "5432"
    - name: REDIS_HOST
      value: redis://my-redis-cluster.y9cnnb.0001.aps1.cache.amazonaws.com
    - name: REDIS_PORT
      value: "6379"
    - name: REDIS_TLS
      value: false
    - name: SESSION_SECRET
      value: "super-secret"
    - name: SESSION_COOKIE_NAME
      value: "emdb.sid"
    - name: SESSION_SAMESITE
      value: "lax"

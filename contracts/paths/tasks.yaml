/tasks:
  get:
    summary: Get tasks by event
    tags: [Tasks]
    parameters:
      - in: query
        name: eventUid
        required: false
        schema:
          type: string
      - in: query
        name: tenantUid
        schema:
          type: string
    responses:
      "200":
        description: Tasks list
        content:
          application/json:
            schema:
              $ref: "../schemas/tasks.schemas.yaml#/TasksListResponse"
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: "../schemas/tasks.schemas.yaml#/ErrorResponse"

  post:
    summary: Create task
    tags: [Tasks]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/tasks.schemas.yaml#/CreateTaskRequest"
    responses:
      "201":
        description: Task created
        content:
          application/json:
            schema:
              $ref: "../schemas/tasks.schemas.yaml#/TaskResponse"

/tasks/assign-task:
  post:
    summary: Assign task
    tags: [Tasks]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/tasks.schemas.yaml#/AssignTaskRequest"
    responses:
      "200":
        description: Task assigned
        content:
          application/json:
            schema:
              $ref: "../schemas/tasks.schemas.yaml#/TaskResponse"

/tasks/accept-task:

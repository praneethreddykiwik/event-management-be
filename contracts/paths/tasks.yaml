/tasks/edit:
  post:
    summary: Update task
    tags: [Tasks]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/tasks.schemas.yaml#/UpdateTaskRequest"
    responses:

/tasks/decline-task:
  post:
    summary: Decline task
    tags: [Tasks]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/tasks.schemas.yaml#/DeclineTaskRequest"
    responses:
      "200":
        description: Task declined
        content:
